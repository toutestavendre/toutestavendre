<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tout est à vendre</title>
  <style>
    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: "Cascadia Code", "Cascadia Mono", Consolas, "Courier New", monospace;
      color: #FFFFFF;
      background: #000000;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .title {
      font-family: Impact, "Arial Black", sans-serif;
      text-transform: uppercase;
      text-align: center;
      font-size: clamp(3rem, 5vw, 5rem);
      letter-spacing: -0.04em;
      padding: 1.5rem 1rem 0.5rem;
    }
    
    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      flex: 1;
      min-height: 0;
    }

    .split__image {
      background: #000000;
      min-height: 0;
      overflow: hidden;
    }
    .split__image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .split__text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2rem, 6vw, 6rem);
      padding-top: clamp(1rem, 4vw, 4rem);
      justify-content: flex-start;
      min-height: 0;
      overflow-y: auto;
    }
    .split__text p {
      font-size: 1.125rem;
      line-height: 1.7;
      max-width: 60ch;
    }
    .split__text p + p { margin-top: 1rem; }

        .contact {
      margin: 1.5rem 0 2.5rem;
      max-width: 60ch;
    }
    .contact label {
      display: block;
      font-size: 1.125rem;
      line-height: 1.7;
      margin-bottom: 1.25rem;
    }
        .contact .status {
      margin-top: 0.75rem;
      font-size: 1rem;
      white-space: pre-line;
    }
    .contact textarea {
      width: 100%;
      min-height: 10rem;
      resize: vertical;
      padding: 0.75rem;
      font: inherit;
      font-size: 1rem;
      color: #FFFFFF;
      background: #000000;
      border: 1px solid #FFFFFF;
      border-radius: 0;
    }
    .contact textarea:focus {
      outline: 2px solid #FFFFFF;
      outline-offset: 2px;
    }
    .contact input[type="email"] {
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.75rem;
      font: inherit;
      font-size: 1rem;
      color: #FFFFFF;
      background: #000000;
      border: 1px solid #FFFFFF;
      border-radius: 0;
    }
    .contact button {
      margin-top: 0.75rem;
      padding: 0.6rem 1.5rem;
      font: inherit;
      font-size: 1rem;
      color: #000000;
      background: #FFFFFF;
      border: 1px solid #FFFFFF;
      cursor: pointer;
    }
    .contact button:hover { background: #000000; color: #FFFFFF; }
    .contact .hp { position: absolute; left: -9999px; }

    @media (max-width: 768px) {
      body { height: auto; }
      .split {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        height: auto;
      }
      .split__image { height: auto; }
      .split__image img { height: auto; max-height: 60vh; }
      .split__text {
        overflow: visible;
        justify-content: flex-start;
        padding: 1rem 1.5rem 2rem;
      }
    }
  </style>
</head>
<body>
   <h1 class="title">TOUT EST A VENDRE</h1>
  
  <main class="split">
    <div class="split__image">
      <img src="vendons.png">
    </div>

    <section class="split__text">
      <p>critique et liquidation par rafales d’images, films, séries, de tous les reels et autres idéologies capitalistes</p>

      <form class="contact" action="https://formspree.io/f/xoedkqqn" method="POST">
        <label for="message">écrivez pour vider vos propres stocks.<br>ce site peut être construit par n'importe-qui voulant collectiviser commerces et médias/barricader ruelles et algorithmes</label>
        <textarea id="message" name="message" required></textarea>
        <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off">
        <button type="submit">envoyer</button>
        <p class="status" id="status"></p>
      </form>

      <p>-> 21/11/2026 : deux films de Peter Watkins qui imaginent la guerre nucléaire</p>
    </section>
  </main>
    <script>
    const form = document.querySelector(".contact");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "envoi en cours…";

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { "Accept": "application/json" }
        });

        if (response.ok) {
          status.textContent = "publication après relecture\nce n'est pas une modération c'est la construction d'un bloc de textes pour imposer l'idée du commun,\nla vraie critique ne peut être que collective, à qui d'autre elle pourrait parler ?";
          form.reset();
        } else {
          status.textContent = "ça s'envoie pas recommence stp";
        }
      } catch (err) {
        status.textContent = "ta connexion galère ressaie :)";
      }
    });
  </script>
</body>
</html>
