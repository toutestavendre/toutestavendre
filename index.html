<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tout est à vendre</title>
  <style>
    * { box-sizing: border-box; margin: 0; }

    body {
      font-family: "Cascadia Code", "Cascadia Mono", Consolas, "Courier New", monospace;
      color: #FFFFFF;
      background: #000000;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      height: 100vh;
    }

    .split__image {
      background: #000000;
      min-height: 0;
      overflow: hidden;
    }
    .split__image img {
      width: 100%;
      height: 100%;
      object-fit: contain;   
      display: block;
    }

    .split__text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(2rem, 6vw, 6rem);
      min-height: 0;
      overflow-y: auto;
    }
    .split__text h1 {
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1.1;
      margin-bottom: 1.25rem;
    }
    .split__text p {
      font-size: 1.125rem;
      line-height: 1.7;
      max-width: 60ch;
    }
    .split__text p + p { margin-top: 1rem; }
    
   @media (max-width: 768px) {
  .split {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
    height: auto;
  }
  .split__image {
    height: auto;
  }
  .split__image img {
    height: auto;
    max-height: 60vh;
  }
  .split__text {
    overflow: visible;
    justify-content: flex-start;
    padding: 1rem 1.5rem 2rem;
  }
}
  }
  .split__image {
    height: 50vh;
  }
  .split__text {
    overflow: visible;
    padding: 2rem 1.5rem;
  }
}
  </style>
</head>
<body>
  <main class="split">
    <div class="split__image">
      <img src="toutestavendretoutestcommun.png">
    </div>

    <section class="split__text">
      <p>tout est à vendre – critique et liquidation par rafales d’images, films, séries, de tous les reels et autres idéologies qu’on nous vend</p>
      <p>écrivez à toutestavendre22@gmail.com pour vider vos propres stocks</p>
      <p>-> 21/11/2026 : deux films de Peter Watkins qui imaginent la guerre nucléaire</p>
    </section>
  </main>
</body>
</html>
